<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ThesisTrade</title><link rel="stylesheet" href="/app.css"><script defer src="/login.js"></script></head><body><main class="login-page"><div class="brand-link">ThesisTrade</div><section class="panel"><h1 id="login-title">登录工作台</h1><p id="login-hint" class="subtle">正在读取登录状态…</p><form id="login-form" hidden><label for="username">账号</label><select id="username" autocomplete="username"><option value="guest">访客 · 查看与提交意见</option><option value="admin">管理员 · 管理员</option></select><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><button class="primary">登录</button></form><form id="setup-form" hidden><label for="admin-password">管理员 密码（至少 12 个字符）</label><input id="admin-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="admin-confirm">再次输入 管理员 密码</label><input id="admin-confirm" type="password" autocomplete="new-password" required><label for="guest-password">访客 密码（至少 12 个字符，与 管理员 不同）</label><input id="guest-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="guest-confirm">再次输入 访客 密码</label><input id="guest-confirm" type="password" autocomplete="new-password" required><button class="primary">完成设置</button></form><p id="login-feedback" class="feedback" role="status" hidden></p></section><p class="subtle">模拟交易工作台 · 仅做模拟买卖</p></main></body></html>
